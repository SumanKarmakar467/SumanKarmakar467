<svg xmlns="http://www.w3.org/2000/svg" width="460" height="360" viewBox="0 0 460 360">
  <defs>
    <linearGradient id="grad-Easy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34e0a1"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="grad-Medium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9f1a"/>
