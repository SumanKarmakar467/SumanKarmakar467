name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SumanKarmakar467
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#238636,#26a641,#39d353,#56d364,#7ee787
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=#00f7ff

      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}